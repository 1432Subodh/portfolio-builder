<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 1200"
  width="1200"
  height="1200"
  fill="none"
>
  <defs>

    <!-- =====================================================
         MAIN GRADIENT
    ====================================================== -->

    <linearGradient
      id="green-main"
      x1="180"
      y1="180"
      x2="1040"
      y2="930"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#005332"/>
      <stop offset="0.28" stop-color="#007B4D"/>
      <stop offset="0.55" stop-color="#00B87A"/>
      <stop offset="0.76" stop-color="#4BE6AF"/>
      <stop offset="1" stop-color="#007247"/>
    </linearGradient>

    <!-- =====================================================
         DARK INNER SURFACE
    ====================================================== -->

    <linearGradient
      id="green-dark"
      x1="920"
      y1="330"
      x2="500"
      y2="900"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#002F20"/>
      <stop offset="0.38" stop-color="#004A31"/>
      <stop offset="0.7" stop-color="#00683F"/>
      <stop offset="1" stop-color="#008B5A"/>
    </linearGradient>

    <!-- =====================================================
         LOWER STEM
    ====================================================== -->

    <linearGradient
      id="green-stem"
      x1="170"
      y1="670"
      x2="490"
      y2="1120"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#58E9B5"/>
      <stop offset="0.32" stop-color="#13C48A"/>
      <stop offset="0.7" stop-color="#008E5D"/>
      <stop offset="1" stop-color="#005333"/>
    </linearGradient>

    <!-- =====================================================
         TOP HIGHLIGHT
    ====================================================== -->

    <linearGradient
      id="green-highlight"
      x1="220"
      y1="145"
      x2="1000"
      y2="440"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#00A878" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#00D294" stop-opacity=".12"/>
      <stop offset=".8" stop-color="#A2FFD9" stop-opacity=".3"/>
      <stop offset="1" stop-color="#B8FFE3" stop-opacity="0"/>
    </linearGradient>

    <!-- =====================================================
         SPARKLE
    ====================================================== -->

    <linearGradient
      id="spark-green"
      x1="1010"
      y1="70"
      x2="1160"
      y2="270"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#00633E"/>
      <stop offset=".5" stop-color="#00A878"/>
      <stop offset="1" stop-color="#55EABB"/>
    </linearGradient>

    <!-- =====================================================
         SOFT GLOW
    ====================================================== -->

    <filter
      id="glow"
      x="-40%"
      y="-40%"
      width="180%"
      height="180%"
    >
      <feGaussianBlur
        stdDeviation="12"
      />
    </filter>

  </defs>


